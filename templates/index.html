<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Predictor</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2e2e33;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-size: 24px;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            margin-bottom: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            background-color: #242428;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .result-box {
            margin-top: 24px;
            padding: 16px;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .churn-yes {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .churn-no {
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--success);
            color: var(--success);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 Customer Churn Predictor</h2>
    <div class="subtitle">Enter customer profile data to process XGBoost prediction pipeline</div>

    <form action="/predict" method="POST">
        <div class="form-grid">
            <!-- Credit Score -->
            <div class="form-group">
                <label for="credit_score">Credit Score</label>
                <input type="number" id="credit_score" name="credit_score" required placeholder="300-850" min="300" max="850">
            </div>

            <!-- Country -->
            <div class="form-group">
                <label for="country">Country</label>
                <select id="country" name="country" required>
                    <option value="France">France</option>
                    <option value="Germany">Germany</option>
                    <option value="Spain">Spain</option>
                </select>
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <!-- Age -->
            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" name="age" required placeholder="Years" min="18" max="100">
            </div>

            <!-- Tenure -->
            <div class="form-group">
                <label for="tenure">Tenure (Years)</label>
                <input type="number" id="tenure" name="tenure" required placeholder="0-10" min="0" max="20">
            </div>

            <!-- Balance -->
            <div class="form-group">
                <label for="balance">Account Balance ($)</label>
                <input type="number" id="balance" name="balance" required placeholder="0.00" step="0.01" min="0">
            </div>

            <!-- Number of Products -->
            <div class="form-group">
                <label for="products_number">Number of Products</label>
                <input type="number" id="products_number" name="products_number" required placeholder="1-4" min="1" max="4">
            </div>

            <!-- Has Credit Card -->
            <div class="form-group">
                <label for="credit_card">Has Credit Card?</label>
                <select id="credit_card" name="credit_card" required>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>

            <!-- Is Active Member -->
            <div class="form-group">
                <label for="active_member">Is Active Member?</label>
                <select id="active_member" name="active_member" required>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>

            <!-- Estimated Salary -->
            <div class="form-group">
                <label for="estimated_salary">Estimated Salary ($)</label>
                <input type="number" id="estimated_salary" name="estimated_salary" required placeholder="Annual Salary" step="0.01" min="0">
            </div>
        </div>

        <button type="submit" id="predictBtn">Predict Churn Status</button>
    </form>

    <div class="result-box {% if 'High Risk' in prediction_text %}churn-yes{% else %}churn-no{% endif %}"
        style="display:block;">
        {{ prediction_text }}
    </div>
</div>

</html>
